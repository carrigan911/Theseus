<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>New project</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
  :root { --bg: #121211; --card: #1c1c1b; --line: #2b2a28; --text: #ecebe6; --dim: #9a978f; --accent: #d97757; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 18px; background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 12px; }
  label { display: block; color: var(--dim); font-size: 12px; margin: 10px 0 4px; }
  input { width: 100%; background: #262624; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font: inherit; }
  .row { display: flex; gap: 8px; }
  button { background: #262624; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 7px 14px; font: inherit; cursor: pointer; }
  button.go { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  #msg { min-height: 40px; margin-top: 10px; color: var(--dim); font-size: 12px; }
  #msg.err { color: #e5766a; }
  .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
</style>
</head>
<body>
<h1>New project</h1>
<label for="n">Project name</label>
<input id="n" type="text" maxlength="41" autofocus>
<label for="f">Folder (pick an existing one, or a new path to create it)</label>
<div class="row"><input id="f" type="text"><button id="b">Browse…</button></div>
<div id="msg">Creates a manager session for the project, with its own checkpoint, and groups the project's sessions together.</div>
<div class="btns"><button id="c">Cancel</button><button id="g" class="go">Create</button></div>
<script>
  const $ = id => document.getElementById(id); let retry = false;
  const say = (t, e) => { $('msg').textContent = t; $('msg').className = e ? 'err' : ''; };
  $('b').onclick = async () => { const p = await window.sphere.projectPick(); if (p) { $('f').value = p; if (!$('n').value) $('n').value = p.split(/[\/]/).pop(); } };
  $('c').onclick = () => window.close();
  $('g').onclick = async () => {
    const n = $('n').value.trim(), f = $('f').value.trim();
    if (!n) return say('Give the project a name.', true); if (!f) return say('Pick a folder.', true);
    $('g').disabled = true; say('Creating… (starting the manager takes about 10 seconds)');
    const r = await window.sphere.projectCreate(n, f, retry).catch(e => ({ ok: false, why: e.message }));
    $('g').disabled = false;
    if (r && r.ok) { say('Created: ' + r.made.join(', ') + '. ' + r.title + ' is starting.'); $('g').disabled = true; setTimeout(() => window.close(), 2500); }
    else { retry = !!(r && r.retry); say((r && r.why) || 'No answer.', true); }
  };
  $('n').oninput = $('f').oninput = () => { retry = false; };
</script>
</body>
</html>
