<!doctype html>
<html><head><meta charset="utf-8"><title>Theseus region</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; cursor: crosshair; user-select: none; }
  #dim { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); }
  #box { position: fixed; display: none; border: 2px solid #00e8f2; background: rgba(0, 232, 242, .08); box-sizing: border-box; }
  #hint { position: fixed; left: 20px; top: 20px; font: 600 14px "Segoe UI", sans-serif; color: #fff; text-shadow: 0 1px 3px #000; }
</style></head>
<body><div id="dim"></div><div id="box"></div><div id="hint">Drag a box to record  -  Esc cancels</div>
<script src="region.js"></script></body></html>
